<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sakai Capital</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #ededed; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  main { max-width: 32rem; padding: 3rem 1.5rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Sakai Capital</h1>
  <p>Este dominio es utilizado por Sakai Capital para el envío de correos. Para mayor información, visite nuestro sitio en <a href="https://sakaicapital.com">sakaicapital.com</a>.</p>
</main>
</body>
</html>
